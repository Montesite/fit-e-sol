<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração de Vitrine</title>
  <meta name="description" content="Fit&Sol – Vitrine online com todos os modelos de roupas fitness e moda praia disponíveis.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracota:      #E87344;
      --terracota-dark: #CC5A2E;
      --dourado:        #D4A24B;
      --preto:          #0F2733;
      --texto:          #1A3A47;
      --cinza:          #4A7A8A;
      --cinza-claro:    #B8DDE8;
      --areia:          #EDF8FB;
      --branco:         #FFFFFF;
    }

    /* Trava total de scroll */
    html, body {
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Remove scrollbar em todos os elementos */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Inter', sans-serif; }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ─── Header ─── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 12px 0;
      background-color: rgba(253, 250, 245, 0.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 2px 24px rgba(0,0,0,0.07);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-img { height: 54px; width: auto; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-links a {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--texto);
      transition: color 0.3s;
      letter-spacing: 0.02em;
    }

    .nav-links a:hover { color: var(--terracota); }

    .nav-cta {
      background-color: var(--terracota) !important;
      color: var(--branco) !important;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600 !important;
      border: 2px solid var(--terracota);
    }
    .nav-cta:hover { background-color: var(--terracota-dark) !important; border-color: var(--terracota-dark) !important; color: var(--branco) !important; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .hamburger span {
      width: 24px;
      height: 2px;
      border-radius: 2px;
      background-color: var(--preto);
      display: block;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--areia);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .mobile-nav.open { display: flex; }

    .mobile-nav a {
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      color: var(--texto);
      transition: color 0.3s;
    }
    .mobile-nav a:hover { color: var(--terracota); }

    .mobile-close {
      position: absolute;
      top: 24px; right: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--texto);
      display: flex;
    }

    /* ─── iframe container ─── */
    #iframe-container {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      width: 100%;
      /* height calculada via JS: 100vh - 80px - 63px */
    }

    #vitrine-iframe {
      width: 100%;
      border: none;
      display: block;
    }

    /* ─── Badge inferior (exatos 63px) ─── */
    #vitrine-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 63px;
      z-index: 100;
      background-color: var(--preto);
      display: flex;
      align-items: center;
    }

    .bottom-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .bottom-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bottom-logo { height: 30px; width: auto; }

    .bottom-slogan {
      font-size: 0.76rem;
      color: rgba(255,255,255,0.45);
    }

    .bottom-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .bottom-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.58);
      transition: color 0.3s;
    }
    .bottom-link:hover { color: var(--terracota); }
    .bottom-link svg { width: 15px; height: 15px; }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .nav-links { gap: 22px; }
      .nav-links a { font-size: 0.83rem; }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .logo-img { height: 44px; }
      .bottom-slogan { display: none; }
    }

    @media (max-width: 480px) {
      .logo-img { height: 38px; }
      .bottom-link span { display: none; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header id="header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" aria-label="Ir para o início">

        <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">

  <nav class="mobile-nav" id="mobileNav" aria-label="Menu mobile">

        <line x1="18" y1="6" x2="6" y2="18"></line>

      </svg>

    <a href="index.html#sobre">Sobre</a>
    <a href="index.html#produtos">Produtos</a>
    <a href="index.html#missao">Nossa missão</a>
    <a href="index.html#contato">Contato</a>
    <a href="vitrine.html">Vitrine online</a>
    <a href="https://wa.me/5591992423020" target="_blank" rel="noopener noreferrer" class="nav-cta" style="margin-top:8px; padding:12px 32px; border-radius:50px;">
      Comprar agora
    </a>
  </nav>

  <!-- ─── iframe (altura dinâmica: 100vh - 80px - 63px) ─── -->
  <div id="iframe-container">
    <iframe
      id="vitrine-iframe"
      src="https://fitesol.egestor.com.br/vitrine/"
      title="Vitrine Fit&Sol – Roupas de academia e moda praia"
    ></iframe>
  </div>

  <!-- ─── Badge inferior 63px ─── -->
  <div id="vitrine-bottom">
    <div class="bottom-inner">
      <div class="bottom-brand">
        <img src="logo.png" alt="Fit&Sol" class="bottom-logo">
        <span class="bottom-slogan">Moda fitness &amp; praia feminina</span>
      </div>
      <div class="bottom-links">
        <a href="https://www.instagram.com/fit_e_sol" target="_blank" rel="noopener noreferrer" class="bottom-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>

            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

        <a href="index.html" class="bottom-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>

      </div>
    </div>
  </div>

  <script>
    /* ── Layout ── */
    function updateLayout() {
      var HEADER_H = document.getElementById('header').offsetHeight;
      var BADGE_H  = 63;
      var iframeH  = window.innerHeight - HEADER_H - BADGE_H;
      var container = document.getElementById('iframe-container');
      var iframe    = document.getElementById('vitrine-iframe');
      container.style.top    = HEADER_H + 'px';
      container.style.height = iframeH + 'px';
      iframe.style.height    = iframeH + 'px';
    }
    window.addEventListener('resize', updateLayout);
    updateLayout();

    /* ── Hamburger ── */
    var hamburger  = document.getElementById('hamburger');
    var mobileNav  = document.getElementById('mobileNav');
    var mobileClose = document.getElementById('mobileClose');

    hamburger.addEventListener('click', function() {
      mobileNav.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
    });

    function closeMobileNav() {
      mobileNav.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
    mobileClose.addEventListener('click', closeMobileNav);
  </script>
</body>
</html>
